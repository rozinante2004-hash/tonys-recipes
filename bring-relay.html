<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bring! Token Relay — Tony's Recipes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #FAF7F2;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 16px; padding: 32px; max-width: 420px;
          width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.1); text-align: center; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h2 { color: #5C3D2E; font-size: 20px; margin-bottom: 8px; }
  p  { color: #8A8279; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
  .btn { display: block; width: 100%; padding: 14px;
         background: #C1440E; color: white; border: none; border-radius: 10px;
         font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #a33a0c; }
  .btn.secondary { background: #8A8279; }
  .status { font-size: 13px; color: #5C3D2E; background: #f5f0ea;
            padding: 10px; border-radius: 8px; margin-top: 12px; }
  .success { color: #2e7d32; background: #e8f5e9; }
  .error   { color: #c62828; background: #ffebee; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛒</div>
  <h2>Refresh Bring! Connection</h2>
  <p>This will update your Bring! token in Tony's Recipes so ingredients keep syncing automatically.</p>
  <div id="status" class="status">Ready to capture token.</div>
  <button class="btn" id="mainBtn" onclick="startCapture()">Connect to Bring!</button>
  <button class="btn secondary" style="margin-top:8px;" onclick="window.close()">Cancel</button>
</div>

<script>
var WORKER_URL = 'https://lively-bread-273a.rozinante2004.workers.dev';
var SECRET     = 'tonys-recipes-2024';

function setStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

function snippet() {
  return 'fetch("' + WORKER_URL + '",{method:"POST",headers:{"Content-Type":"application/json"},'
    + 'body:JSON.stringify({action:"bring-settoken",token:localStorage.getItem("accessToken"),secret:"' + SECRET + '"})})'
    + '.then(r=>r.json()).then(d=>alert(d.success?"Token updated!":"Failed: "+d.message))';
}

function startCapture() {
  // NOTE: this page cannot read Bring!'s localStorage — different origin, no
  // exception. The old code opened Bring! in a *sized popup* and polled for 30
  // seconds before giving up; worse, a sized popup has no bookmarks bar, so the
  // 🛒 bookmarklet could not be clicked either. Open a normal tab instead and
  // show the manual options straight away.
  var bringWin = window.open('https://web.getbring.com', '_blank');
  if (!bringWin) {
    setStatus('Popup blocked. Please allow popups for this site, or open web.getbring.com yourself.', 'error');
  } else {
    setStatus('Bring! opened in a new tab. Use one of the two options below there.', '');
  }
  showManual();
}

function showManual() {
  document.getElementById('mainBtn').style.display = 'none';
  var el = document.createElement('div');
  el.style.cssText = 'text-align:left;font-size:13px;color:#5C3D2E;margin-top:14px;line-height:1.6;';
  el.innerHTML =
      '<strong>Option A — the 🛒 bookmark</strong><br>'
    + 'On the <em>web.getbring.com</em> tab (signed in), click your '
    + '"Refresh Bring! Token" bookmark. If you can\'t see the bookmarks bar, press '
    + '<kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd> to show it — a sized popup window never has one, '
    + 'which is why this page now opens Bring! as a normal tab.'
    + '<br><br><strong>Option B — paste one line into the console</strong><br>'
    + 'On the <em>web.getbring.com</em> tab press <kbd>F12</kbd> → <em>Console</em>, paste the line below, Enter. '
    + '(Chrome may ask you to type <code>allow pasting</code> first.)'
    + '<div style="position:relative;margin-top:8px;">'
    + '<textarea id="snippetBox" readonly style="width:100%;height:80px;font-family:monospace;font-size:10px;'
    + 'border:1px solid #ddd;border-radius:8px;padding:8px;background:#f5f0ea;resize:none;box-sizing:border-box;"></textarea>'
    + '<button id="copySnippet" style="position:absolute;top:6px;right:6px;font-size:11px;padding:3px 8px;'
    + 'background:#C1440E;color:white;border:none;border-radius:5px;cursor:pointer;">Copy</button>'
    + '</div>'
    + '<div style="margin-top:6px;">You\'ll get an alert confirming success. Then come back to Tony\'s Recipes and press <em>Check</em>.</div>';
  document.querySelector('.card').appendChild(el);
  document.getElementById('snippetBox').value = snippet();
  document.getElementById('copySnippet').onclick = function() {
    var box = document.getElementById('snippetBox');
    box.select();
    navigator.clipboard.writeText(box.value)
      .then(function(){ document.getElementById('copySnippet').textContent = 'Copied!'; })
      .catch(function(){ document.execCommand('copy'); document.getElementById('copySnippet').textContent = 'Copied!'; });
  };
}

function sendToken(token) {
  setStatus('Token captured! Sending to Tony\'s Recipes...', '');

  // Decode to check expiry
  try {
    var payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    var exp = new Date(payload.exp * 1000);
    var days = Math.floor((payload.exp * 1000 - Date.now()) / 86400000);
    setStatus('Token captured! Expires ' + exp.toLocaleDateString() + ' (' + days + ' days). Sending...', '');
  } catch(e) {}

  // Send to Worker
  fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'bring-settoken', token: token, secret: SECRET })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) {
      setStatus('Token updated successfully! Bring! connection valid for 7 days.', 'success');
      // Notify parent window (Tony's Recipes app)
      if (window.opener) {
        window.opener.postMessage({ bringToken: token }, 'https://rozinante2004-hash.github.io');
      }
      setTimeout(function() { window.close(); }, 2500);
    } else {
      setStatus('Worker update failed: ' + (d.message || d.error), 'error');
      showManual();
    }
  })
  .catch(function(err) {
    setStatus('Network error: ' + err.message, 'error');
    showManual();
  });
}

// If this page was opened by the app, auto-start
if (document.referrer && document.referrer.includes('rozinante2004-hash.github.io')) {
  setTimeout(startCapture, 500);
}
</script>
</body>
</html>
