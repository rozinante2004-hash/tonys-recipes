name: Move the family into the community copy

# v38.22 — Tony, 11 Oct 2026 (option B): the family app's households move into
# the community copy (mykitchennotes.community), with their accounts, so testers
# can join his live recipes. tools/move-family.mjs does the work; this job only
# runs it, by hand:
#
#   survey  — reads both databases and says what a copy would do (counts only).
#   copy    — into the TEST copy first (a rehearsal), then into the community
#             copy; "mark" also marks the family households as moved, so the
#             family app stops and points to the new address.
#   remove  — takes a rehearsal out of the test copy again.
#   clear-check / clear-source — (v38.40, move-day step 9, a week after the move and
#             with Tony's OK) count, then delete from the FAMILY's database what the
#             community copy holds; "all" also what it does not hold, "shared" also the
#             first layout's shared/. Needs  clear the family app  in confirm.
#
# Copying into the community copy needs the words "move the family" in
# `confirm`; removing needs "remove". The log shows counts only (the repository
# is public).
#
# Needs (Tony, once): for rules-publisher@recipes-f379d.iam.gserviceaccount.com
# (FIREBASE_RULES_KEY) — on recipes-f379d "Cloud Datastore User" (it writes the
# moved mark) and "Firebase Authentication Viewer"; on the target
# "Cloud Datastore User" and "Firebase Authentication Admin".

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "survey, copy, remove — or unmark (the way back: the family app works again); clear-check / clear-source (step 9)"
        required: true
        default: survey
        type: choice
        options: [survey, copy, remove, unmark, clear-check, clear-source, clear-detail]
      target:
        description: "where to"
        required: true
        default: tonys-recipes-test
        type: choice
        options: [tonys-recipes-test, my-kitchen-notes-beta]
      mark:
        description: "copy: also mark the family's households as moved (move day only)"
        required: false
        default: false
        type: boolean
      i18n:
        description: "copy: also the shared translations"
        required: false
        default: false
        type: boolean
      resume:
        description: "copy: the same copy a second time (overwrites what the first one wrote)"
        required: false
        default: false
        type: boolean
      all:
        description: "clear-source: also what the community copy does not hold"
        required: false
        default: false
        type: boolean
      shared:
        description: "clear-source: also the first layout's shared/ collection"
        required: false
        default: false
        type: boolean
      pubkey:
        description: "clear-detail: the public key the list is sealed for (base64 of a PEM) — names never go in the log"
        required: false
        default: ""
      confirm:
        description: "copy into my-kitchen-notes-beta: type  move the family   ·   remove: type  remove   ·   unmark: type  unmark   ·   clear-source: type  clear the family app"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: move-family
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      FIREBASE_KEY: ${{ secrets.FIREBASE_RULES_KEY }}
    steps:
      # (the branch it was started from: main, or the test branch for a tool fixed there)
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Allowed?
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
          MARK: ${{ inputs.mark }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then echo "::error::FIREBASE_RULES_KEY is missing"; exit 1; fi
          if [ "$MODE" = "copy" ] && [ "$TARGET" = "my-kitchen-notes-beta" ] && [ "$CONFIRM" != "move the family" ]; then
            echo "::error::copying into the community copy needs  move the family  in confirm"; exit 1; fi
          if [ "$MODE" = "remove" ] && [ "$CONFIRM" != "remove" ]; then
            echo "::error::removing needs  remove  in confirm"; exit 1; fi
          if [ "$MODE" = "unmark" ] && [ "$CONFIRM" != "unmark" ]; then
            echo "::error::unmarking needs  unmark  in confirm"; exit 1; fi
          if [ "$MODE" = "clear-source" ] && [ "$CONFIRM" != "clear the family app" ]; then
            echo "::error::clearing the family's database needs  clear the family app  in confirm"; exit 1; fi
          if [ "${MODE#clear-}" != "$MODE" ] && [ "$TARGET" != "my-kitchen-notes-beta" ]; then
            echo "::error::the family's database is cleared only against the community copy it moved into"; exit 1; fi
          if [ "$MARK" = "true" ] && [ "$TARGET" != "my-kitchen-notes-beta" ]; then
            echo "::error::the family is marked as moved only when it moves into the community copy"; exit 1; fi

      - name: Run
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          MARK: ${{ inputs.mark }}
          I18N: ${{ inputs.i18n }}
          RESUME: ${{ inputs.resume }}
          ALL: ${{ inputs.all }}
          SHARED: ${{ inputs.shared }}
          CONFIRM: ${{ inputs.confirm }}
          PUBKEY: ${{ inputs.pubkey }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}     # v38.27 — only to say whether the owner's account was already there
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund google-auth-library@9 >/dev/null
          SITE=$(node -e "const e=require('./tools/environments.json');process.stdout.write(e.beta.siteOrigin+'/')")
          ARGS="--from recipes-f379d --to $TARGET --mode $MODE"
          [ "$MARK" = "true" ] && ARGS="$ARGS --mark-moved $SITE"
          [ "$I18N" = "true" ] && ARGS="$ARGS --i18n"
          [ "$RESUME" = "true" ] && ARGS="$ARGS --resume"
          [ "$ALL" = "true" ] && ARGS="$ARGS --all"
          [ "$SHARED" = "true" ] && ARGS="$ARGS --shared"
          [ "$MODE" = "remove" ] && ARGS="$ARGS --confirm remove"
          [ "$MODE" = "unmark" ] && ARGS="$ARGS --confirm unmark"
          [ "$MODE" = "clear-detail" ] && ARGS="$ARGS --pubkey $PUBKEY"
          if [ "$MODE" = "clear-source" ]; then node tools/move-family.mjs $ARGS --confirm "$CONFIRM"; else node tools/move-family.mjs $ARGS; fi
