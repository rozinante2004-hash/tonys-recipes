name: Translate new phrases

# v38.14 — Tony: "Is there a way you could run Update all supported languages in
# the family app once it is updated instead of every time asking me to do it?"
# When a release reaches `main` (Tony's yes), the app's new phrases are
# translated into every published language — by the app's own code, in a hidden
# browser (tools/translate-new.mjs) — and ADDED to the central translations.
# "Publish languages" then puts them in i18n/*.json, as after a run in the app.
#
# Anthropic (the translations' AI): by Workload Identity Federation — no key
# stored; this run's GitHub identity is exchanged for a ten-minute token, allowed
# by the federation rule in Claude Console for this repository's `main` only. Its
# four IDs (not secrets) are repository variables: ANTHROPIC_FEDERATION_RULE_ID,
# ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID.
# (Or else a secret ANTHROPIC_API_KEY.) And FIREBASE_RULES_KEY (already there for
# the rules), whose service account also needs "Cloud Datastore User" on
# recipes-f379d. Without them the job says so and does nothing.

# Only PUSHES to main run it: the federation rule allows "Only push" (Tony's pick in
# the Console), so a hand-started run would be refused. A run that failed (keys not
# there yet, Anthropic busy) is retried with "Re-run jobs", which keeps its event.
# The job's own files are in `paths` so that a change to the job runs it as well.
on:
  push:
    branches: ["main"]
    paths: ["index.html", "tools/translate-new.mjs", ".github/workflows/translate-languages.yml"]

permissions:
  contents: read
  actions: write
  id-token: write      # this run's GitHub identity, for Anthropic's federation

concurrency:
  group: translate-languages
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      FIREBASE_RULES_KEY: ${{ secrets.FIREBASE_RULES_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Are the keys there?
        id: key
        run: |
          if { [ -z "$ANTHROPIC_FEDERATION_RULE_ID" ] && [ -z "$ANTHROPIC_API_KEY" ]; } || [ -z "$FIREBASE_RULES_KEY" ]; then
            echo "::warning::No way to reach Anthropic (the federation's repository variables, or ANTHROPIC_API_KEY), or FIREBASE_RULES_KEY is missing — the new phrases were NOT translated (🔄 Update all supported languages in the family app still works)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install a browser for the app
        if: steps.key.outputs.ok == 'true'
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund playwright@1.56.1 google-auth-library@9 >/dev/null
          npx playwright install --with-deps chromium

      - name: Translate what is new, and add it to the shared translations
        if: steps.key.outputs.ok == 'true'
        run: node tools/translate-new.mjs

      # The job's own token cannot start other workflows by pushing, so it asks directly.
      - name: Publish them
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-languages.yml --ref main -f force=false
