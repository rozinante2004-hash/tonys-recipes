name: Deploy the Worker

# The Cloudflare Worker publishes itself when a release that changes it reaches
# `main` (the family's copy) — which happens only on Tony's yes. Before this,
# Tony pasted cloudflare-worker.js into the Cloudflare dashboard by hand.
# Needs the repository secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers"
# token); without it the job says so and does nothing.

# v38.99 — and from `test` (Tony, 27 Oct: "Perhaps we should update the database rules and server immediately upon
# the release to the test version"): the test copy then runs against the server its build expects. There is one server
# for all three copies, so a server change is written to keep working with the app already released (as before), and
# is published only when the Worker checks below pass.
on:
  push:
    branches: ["main", "test"]
    paths: ["cloudflare-worker.js", "worker/wrangler.jsonc", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Is the Cloudflare token there?
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — the Worker was NOT published. Add it under Settings → Secrets and variables → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            # v38.99 — never older over newer: the test copy publishes its server first, and a release of an earlier
            # build to main must not take the live server back.
            want=$(grep -oE "^const WORKER_VERSION = 'v[0-9]+'" cloudflare-worker.js | grep -oE "[0-9]+")
            live=$(curl -s -m 15 -X POST -H 'Content-Type: application/json' -d '{"action":"health"}' https://lively-bread-273a.rozinante2004.workers.dev/ | grep -oE '"version":"v[0-9]+"' | grep -oE '[0-9]+')
            if [ -n "$live" ] && [ -n "$want" ] && [ "$live" -gt "$want" ]; then
              echo "::notice::the live Worker is v$live, newer than this v$want — left as it is"
              echo "ok=false" >> "$GITHUB_OUTPUT"
            else
              echo "ok=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Never publish a Worker that fails its own checks.
      - name: Worker checks (CORS, origin, app key, sign-in, metering)
        if: steps.token.outputs.ok == 'true'
        run: node tests/worker-cors.mjs

      # v74 — the owner's address is no longer in the code (the repository is public): it is
      # the Worker's secret OWNER_EMAIL, set here from the GitHub secret of the same name,
      # BEFORE publishing — so a Worker without it is never published (v73 stays live).
      # v75 — and the spare owner key (OWNER_SECONDARY_EMAIL, when set): both addresses go in, comma-separated.
      - name: The owner's address
        if: steps.token.outputs.ok == 'true'
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_SECONDARY_EMAIL: ${{ secrets.OWNER_SECONDARY_EMAIL }}
        run: |
          if [ -z "$OWNER_EMAIL" ]; then echo "::error::OWNER_EMAIL is not set (Settings → Secrets and variables → Actions) — the Worker was NOT published: without it nobody could use the owner's tools."; exit 1; fi
          owners="$OWNER_EMAIL"; [ -n "$OWNER_SECONDARY_EMAIL" ] && owners="$owners,$OWNER_SECONDARY_EMAIL"
          printf '%s' "$owners" | npx --yes wrangler@4 secret put OWNER_EMAIL --config worker/wrangler.jsonc >/dev/null
          if [ -n "$OWNER_SECONDARY_EMAIL" ]; then echo "the owner's address and the spare owner's are set"; else echo "the owner's address is set"; fi

      - name: Publish
        if: steps.token.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy --config worker/wrangler.jsonc

      # v79 — the hourly usage watch (cf-usage.yml) reports to the Worker with a key DERIVED from the
      # Cloudflare token both jobs already hold, so there is nothing new to keep; never printed.
      - name: The usage watch's key
        if: steps.token.outputs.ok == 'true'
        run: |
          node -e "process.stdout.write(require('crypto').createHmac('sha256', process.env.CLOUDFLARE_API_TOKEN).update('mkn-usage-watch-v1').digest('hex'))" \
            | npx --yes wrangler@4 secret put USAGE_KEY --config worker/wrangler.jsonc >/dev/null
          echo "the usage watch's key is set"

      # v73 — where the owner's alerts go (Tony's second address, verified in
      # Cloudflare Email Routing): the GitHub secret ALERT_EMAIL becomes the
      # Worker's secret ALERT_TO. Never printed; without it, no alerts.
      # v75 — the alerts go to the alert address AND to each owner account, so neither owner acts unseen.
      # (Each must be a verified destination in Cloudflare Email Routing; one that is not is skipped.)
      - name: The owner's alert addresses
        if: steps.token.outputs.ok == 'true'
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_SECONDARY_EMAIL: ${{ secrets.OWNER_SECONDARY_EMAIL }}
        run: |
          if [ -z "$ALERT_EMAIL" ]; then echo "::notice::ALERT_EMAIL is not set — the owner's alerts stay off."; exit 0; fi
          to=$(printf '%s\n%s\n%s\n' "$ALERT_EMAIL" "$OWNER_EMAIL" "$OWNER_SECONDARY_EMAIL" | tr 'A-Z' 'a-z' | sed 's/^ *//; s/ *$//' | grep -v '^$' | awk '!seen[$0]++' | paste -sd, -)
          printf '%s' "$to" | npx --yes wrangler@4 secret put ALERT_TO --config worker/wrangler.jsonc >/dev/null
          echo "the alert addresses are set ($(printf '%s' "$to" | tr ',' '\n' | grep -c .) of them)"

      # v84 — the owner on WhatsApp (CallMeBot: his number and the key it gave him) and the hourly usage check on
      # Cloudflare's own clock (a token that may only read analytics). Each is set from the GitHub secret of the same
      # name when there is one; never printed. Without them: e-mail only, and the GitHub watch only.
      # 23 Oct 2026 — and the photo libraries' keys (Tony: "Yes, set it up for the Pexels and Unsplash keys"): without
      # them only Pixabay and Wikimedia Commons answer photo searches. An unset one leaves the Worker's value as it is.
      # 24 Oct 2026 — and the token that writes the testers' reports into the private repository kitchen-reports
      # (Worker v90; a fine-grained token for that repository only: Contents, Issues, Pull requests).
      # 29 Oct 2026 — and the e-mail service's key (Worker v98: 📤 Share → ✉️ Email sent by the server, through Resend;
      # MAIL_FROM, optional, the sending address on the domain verified there — "recipes" at the community domain if unset).
      - name: WhatsApp, the hourly check, the photo libraries and the reports repository
        if: steps.token.outputs.ok == 'true'
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_KEY: ${{ secrets.WHATSAPP_KEY }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          REPORTS_GITHUB_TOKEN: ${{ secrets.REPORTS_GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          for name in WHATSAPP_PHONE WHATSAPP_KEY CF_ANALYTICS_TOKEN PEXELS_API_KEY UNSPLASH_ACCESS_KEY REPORTS_GITHUB_TOKEN NTFY_TOPIC NTFY_TOKEN PUSHOVER_TOKEN PUSHOVER_USER RESEND_API_KEY MAIL_FROM; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config worker/wrangler.jsonc >/dev/null; echo "$name is set"
            else echo "::notice::$name is not set (Settings → Secrets and variables → Actions) — left as it is"; fi
          done

      # The Worker says which version it is; it must be the one just published —
      # with its database (METER_DB) and its storage (BRING_KV) still connected.
      - name: Check the live Worker answers with this version
        if: steps.token.outputs.ok == 'true'
        run: |
          want=$(grep -oE "^const WORKER_VERSION = '[^']+'" cloudflare-worker.js | grep -oE "v[0-9]+")
          for i in 1 2 3 4 5 6; do
            h=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"health"}' https://lively-bread-273a.rozinante2004.workers.dev/)
            got=$(echo "$h" | grep -oE '"version":"v[0-9]+"' | grep -oE 'v[0-9]+')
            echo "live: $got, published: $want"
            if [ "$got" = "$want" ]; then
              echo "$h" | grep -q '"db":true' || { echo "::error::the Worker lost its database (METER_DB)"; exit 1; }
              # v78 — rateLimiting is now true with the database alone; Bring! says whether KV is bound.
              echo "$h" | grep -q '"bring":true' || { echo "::error::the Worker lost its storage (BRING_KV)"; exit 1; }
              echo "$h" | grep -q '"owner":true' || { echo "::error::the Worker has no owner's address (OWNER_EMAIL)"; exit 1; }
              echo "database, storage and the owner's address connected"; exit 0
            fi
            sleep 10
          done
          echo "::error::the live Worker does not report $want"; exit 1
