name: Self Tests

# 5.6 — the Self Test suite used to be run by hand, which meant a regression
# reached Tony before it reached anyone else. It runs here on every push now.
#
# The net_* and stor_firebase checks are skipped: they need real network and a
# signed-in Firebase session, so they cannot pass on a runner. Everything else
# is held to a pass, and the runner also fails the build if a test closes the
# Self Test modal or strands a dialog — that kind of breakage makes later tests
# run blind while still reporting green.

on:
  push:
    # `test` (v36.74): new work lands there first, and Cloudflare Pages builds
    # the test copy from it; `main` is the family's copy.
    branches: ["main", "test"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-tests:
    # 20 Oct 2026 — ubuntu-latest became Ubuntu 26.04 overnight and Playwright 1.56 cannot install a browser
    # there ("Playwright does not support chromium on ubuntu26.04-x64"): every self-test run failed before a test ran.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Two separate things, and conflating them is why the first run of this
      # workflow failed: `playwright install` downloads the BROWSERS, but the
      # runner also has to be able to `require('playwright')`, and npx resolves
      # the package into a temp cache that node cannot see from tests/.
      - name: Install Playwright (package + Chromium)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund playwright@1.56.1 axe-core@4.10.2
          npx playwright install --with-deps chromium

      # A single-file app fails silently and completely on a syntax error, so
      # check the inline scripts parse before spending time on a browser.
      #
      # HTML comments are blanked out first. The CSP note near the top of
      # index.html contains the words "one inline <script> with inline handlers",
      # and this regex matched THAT, captured the prose after it up to the next
      # </script>, and reported a syntax error in it. Because this is step 5 of 9,
      # the failure SKIPPED the self-tests, the version guard and the Worker
      # checks: from v31.1 to v32.7 the workflow was red and verifying nothing,
      # while every one of those checks passed when run by hand. A green tick
      # nobody looks at is a missing test; a red cross nobody looks at is worse.
      # Blanking rather than deleting keeps line numbers honest, and a zero count
      # is now a failure too — a matcher that finds nothing must not report pass.
      - name: Syntax-check the inline scripts
        run: |
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('index.html', 'utf8');
            const html = raw.replace(/<!--[\s\S]*?-->/g, c => c.replace(/[^\n]/g, ' '));
            const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
            let m, bad = 0, i = 0;
            while ((m = re.exec(html))) {
              i++;
              try { new Function(m[1]); }
              catch (e) { bad++; console.error('inline script #' + i + ': ' + e.message); }
            }
            if (!i) { console.error('no inline scripts found at all — the matcher is broken'); process.exit(1); }
            // v36.15 — the suite is its own file now, and nothing else parses it.
            try { new Function(fs.readFileSync('self-tests.js', 'utf8')); }
            catch (e) { bad++; console.error('self-tests.js: ' + e.message); }
            console.log(bad ? 'FAILED' : 'all ' + i + ' inline scripts parse, and self-tests.js');
            process.exit(bad ? 1 : 0);
          "

      - name: Serve the app
        run: |
          python3 -m http.server 8137 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8137/index.html && break
            sleep 1
          done

      - name: Run the Self Test suite
        run: node tests/run-self-tests.js --port 8137

      # v36.54 — the same suite again, starting from Tony's phone's saved
      # settings instead of a factory-fresh browser. Four times a test has
      # failed on his device and passed here because something he had chosen
      # was never true in CI; the last was Imperial units, which v36.51 began
      # remembering. Add a setting here when it starts to matter.
      - name: Run the Self Test suite as Tony's phone is set up
        run: node tests/run-self-tests.js --port 8137 --prefs '{"tonys_view_unit":"imperial","tonys_theme":"dark"}'

      # v36.58 — and as his PC is: logging on, the nudge on, and a log that
      # already holds an error, so the nudge fires at startup BEFORE the suite
      # runs. log_nudge_is_quiet_and_per_device assumed it had not, and failed
      # only there.
      - name: Run the Self Test suite as Tony's PC is set up
        run: |
          PREFS=$(node -e "console.log(JSON.stringify({tonys_log_enabled:'1',tonys_log_nudge:'1',tonys_sync_log:JSON.stringify([{at:Date.now()-60000,k:'error',m:'An old error from before the run'}])}))")
          node tests/run-self-tests.js --port 8137 --prefs "$PREFS"

      # v36.63 (audit R1) — and with the interface in Hebrew, which is how his
      # phone may well start. The runner parks the language exactly as the
      # app's own Self Test does; without that parking seven tests fail here.
      # The stand-in dictionary has no English in it, so a pass means the
      # suite really did put the interface back into English first.
      - name: Run the Self Test suite with a translated interface
        run: node tests/run-self-tests.js --port 8137 --lang he --prefs '{"tonys_view_unit":"imperial","tonys_theme":"dark"}'

      # v36.72 (go-public WP-A step 3) — the two copies. The LIVE build must be
      # the source byte for byte (its settings ARE the #appConfig block); the
      # TEST build must not name the family's Firebase project anywhere (the
      # build refuses if it does), and the whole suite must pass on it — it is
      # what Cloudflare Pages publishes at tonys-recipes-test.pages.dev.
      - name: Build both copies
        run: |
          node tools/build.js live && cmp dist/index.html index.html
          node tools/build.js test

      # v38.72 — the test and community copies are built without their comments (tools/strip-comments.js). Every
      # comment the stripper finds must be exactly one a real parser (acorn) finds, and every stripped script must parse.
      - name: Comments taken out exactly (acorn)
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/acorn" acorn@8 >/dev/null
          ACORN_PATH="$RUNNER_TEMP/acorn/node_modules/acorn" node tools/check-strip.js index.html dist/index.html

      - name: Run the Self Test suite on the built TEST copy
        run: |
          (cd dist && python3 -m http.server 8139 --bind 127.0.0.1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8139/index.html && break; sleep 1; done
          node tests/run-self-tests.js --port 8139

      # The version banner only fires when version.json and APP_VERSION agree,
      # so a bump that misses one of them ships an update nobody is told about.
      - name: Check the version strings agree
        run: |
          node -e "
            const fs = require('fs');
            const declared = JSON.parse(fs.readFileSync('version.json', 'utf8')).version;
            const html = fs.readFileSync('index.html', 'utf8');
            const found = new Set();
            const patterns = [
              /<!-- Tony's Recipes Collection (v[\d.]+) -->/,
              /var APP_VERSION = '(v[\d.]+)'/,
            ];
            for (const p of patterns) { const m = html.match(p); if (m) found.add(m[1]); }
            for (const m of html.matchAll(/letter-spacing:0\.5px;\">(v[\d.]+)<\/div>/g)) found.add(m[1]);
            const all = [...found];
            if (all.length !== 1 || all[0] !== declared) {
              console.error('version.json says ' + declared + ' but index.html carries: ' + all.join(', '));
              process.exit(1);
            }
            console.log('version strings agree: ' + declared);
          "

      # v38.29 — the app knows its owners only by salted fingerprints (APP_CONFIG.ownerKeys); the
      # addresses are the GitHub secrets OWNER_EMAIL and OWNER_SECONDARY_EMAIL. A fingerprint that does
      # not match its secret would show the owner's tools to nobody (the rules and the Worker would still
      # work). Never prints an address — only whether each matches, and the fingerprint to use if not.
      # Without the secrets (a fork) it says so and passes.
      - name: The owner fingerprints
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_SECONDARY_EMAIL: ${{ secrets.OWNER_SECONDARY_EMAIL }}
        run: |
          node -e "
            const fs = require('fs'), crypto = require('crypto');
            const html = fs.readFileSync('index.html', 'utf8');
            const m = /ownerKeys:\s*Object\.freeze\(\[([^\]]*)\]\)/.exec(html);
            const keys = m ? (m[1].match(/sha256:[0-9a-f]{64}/g) || []) : [];
            const key = a => 'sha256:' + crypto.createHash('sha256').update('mkn-owner|' + a.trim().toLowerCase()).digest('hex');
            let bad = 0;
            for (const [name, v] of [['OWNER_EMAIL', process.env.OWNER_EMAIL], ['OWNER_SECONDARY_EMAIL', process.env.OWNER_SECONDARY_EMAIL]]) {
              if (!v) { console.log('::notice::' + name + ' is not available here — not checked'); continue; }
              if (keys.includes(key(v))) console.log(name + ': its fingerprint is in the app');
              else { bad++; console.log('::error::' + name + ': its fingerprint is not in APP_CONFIG.ownerKeys — use ' + key(v)); }
            }
            if (!keys.length) { console.log('::error::no APP_CONFIG.ownerKeys in index.html'); bad++; }
            process.exit(bad ? 1 : 0);
          "

      # The Worker had no tests until v36, and a CORS regression in it took every
      # server-side feature down for three releases without the suite noticing —
      # that suite only ever loaded index.html. This drives the Worker directly.
      # v36.59 — the Firestore rules, against the REAL emulator. They used to be
      # pasted into the console and checked by nothing, which is how the app's
      # fallback copy kept an `allow write` that silently granted deletion.
      # `demo-` projects never touch a real Firebase project.
      - name: Set up Java (for the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules checks (emulator)
        run: |
          mkdir -p /tmp/rules && cd /tmp/rules
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10 >/dev/null
          # The emulator wants a startable rules file; the test loads the real
          # template itself and fills in the member lists.
          sed -e "s/{{READ}}/'a@b'/g; s/{{WRITE}}/'a@b'/g; s/{{ADMIN}}/'a@b'/g; s/{{APP_ADMINS}}/'a@b'/g" \
            "$GITHUB_WORKSPACE/firestore.rules" > boot.rules
          echo '{"firestore":{"rules":"boot.rules"},"emulators":{"firestore":{"port":8085},"ui":{"enabled":false}}}' > firebase.json
          mkdir -p tests && cp "$GITHUB_WORKSPACE/tests/firestore-rules.test.mjs" tests/
          cp "$GITHUB_WORKSPACE/firestore.rules" ./firestore.rules
          npx firebase emulators:exec --only firestore --project demo-rules "node tests/firestore-rules.test.mjs"

      # v36.84 (WP-D) — the household rules (in firestore.rules since v36.86): who may found,
      # join, invite, manage, read, write and delete, across separate households.
      - name: Household rules checks (emulator)
        run: |
          mkdir -p /tmp/hh && cd /tmp/hh
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10 >/dev/null
          sed -e "s/{{READ}}/'a@b'/g; s/{{WRITE}}/'a@b'/g; s/{{ADMIN}}/'a@b'/g; s/{{APP_ADMINS}}/'a@b'/g" "$GITHUB_WORKSPACE/firestore.rules" > boot.rules
          echo '{"firestore":{"rules":"boot.rules"},"emulators":{"firestore":{"port":8085},"ui":{"enabled":false}}}' > firebase.json
          mkdir -p tests && cp "$GITHUB_WORKSPACE/tests/firestore-households-rules.test.mjs" tests/
          cp "$GITHUB_WORKSPACE/firestore.rules" ./
          npx firebase emulators:exec --only firestore --project demo-households "node tests/firestore-households-rules.test.mjs"

      # v38.22 — the family's move into the community copy (tools/move-family.mjs),
      # rehearsed between two demo projects on the Firestore and Auth emulators:
      # accounts keep their ids, documents read back the same, the owner's own
      # account there keeps his places, a failure takes the moved mark off, and
      # nothing personal is printed.
      - name: Family move (emulator)
        run: |
          mkdir -p /tmp/mv && cd /tmp/mv
          echo '{"emulators":{"firestore":{"port":8086},"auth":{"port":9099},"ui":{"enabled":false},"singleProjectMode":false}}' > firebase.json
          cp "$GITHUB_WORKSPACE/tests/move-family.test.mjs" .
          /tmp/hh/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-family "node move-family.test.mjs $GITHUB_WORKSPACE/tools/move-family.mjs"

      # 14 Oct 2026 — the owner's way back in without the authenticator (tools/owner-recovery.mjs,
      # the "Owner recovery" job): Require switched off, one owner account's second step removed,
      # nothing without the typed confirmation, no address or id in the log.
      - name: Owner recovery (emulator)
        run: |
          mkdir -p /tmp/rec && cd /tmp/rec
          echo '{"emulators":{"firestore":{"port":8086},"auth":{"port":9099},"ui":{"enabled":false},"singleProjectMode":false}}' > firebase.json
          cp "$GITHUB_WORKSPACE/tests/owner-recovery.test.mjs" .
          /tmp/hh/node_modules/.bin/firebase emulators:exec --only firestore,auth --project demo-family "node owner-recovery.test.mjs $GITHUB_WORKSPACE/tools/owner-recovery.mjs"

      # v36.91 — the job that publishes the languages into i18n/*.json, run
      # against the emulator with the real rules (translations are public).
      - name: Language publishing job (emulator)
        run: |
          cd /tmp/hh
          cp "$GITHUB_WORKSPACE/tests/publish-languages.test.mjs" tests/
          REPO="$GITHUB_WORKSPACE" npx firebase emulators:exec --only firestore --project demo-langs "node tests/publish-languages.test.mjs"

      # v36.71 (go-public WP-A step 2) — the app itself, signed in, on several
      # simulated devices, syncing through the Firestore + Auth EMULATORS
      # against the published rules. The first time the suite runs the app
      # signed in at all; it found two real sync bugs on its first run. The
      # Firebase SDK is served from npm at the version the app loads, and a
      # `demo-` project can never reach a real backend.
      - name: End-to-end sync on the Firebase emulator
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@5 firebase@12.19.0 playwright@1.56.1 >/dev/null
          sed -e "s/{{READ}}/'a@b'/g; s/{{WRITE}}/'a@b'/g; s/{{ADMIN}}/'a@b'/g; s/{{APP_ADMINS}}/'a@b'/g" \
            "$GITHUB_WORKSPACE/firestore.rules" > boot.rules
          echo '{"firestore":{"rules":"boot.rules"},"emulators":{"firestore":{"port":8085},"auth":{"port":9099},"ui":{"enabled":false}}}' > firebase.json
          npx firebase emulators:exec --only firestore,auth --project demo-tonys "node $GITHUB_WORKSPACE/tests/e2e-sync.mjs"

      # v36.85 (WP-D) — the same devices with every household in its own space:
      # founding, places kept by e-mail, a separate newcomer, invitation links,
      # and Family Access editing members directly.
      - name: End-to-end sync, household layout (emulator)
        run: |
          cd /tmp/e2e
          npx firebase emulators:exec --only firestore,auth --project demo-tonys "node $GITHUB_WORKSPACE/tests/e2e-sync.mjs --layout households"

      - name: Worker checks (CORS, origin, app key)
        run: node tests/worker-cors.mjs

      # extension 1.0 — the "Save recipes from Facebook" extension, installed in a real
      # Chromium, against an imitation Facebook feed and reel page.
      - name: Browser extension (Save recipe under Facebook posts)
        run: |
          node tools/build-extension.mjs live
          node tools/build-extension.mjs test
          node tools/build-extension.mjs beta
          node tests/extension.mjs
          # 1.4 — the zips the app offers for download are what this source builds.
          git diff --exit-code --stat downloads/ || { echo "downloads/ is stale: run node tools/build-extension.mjs live, test and beta, and commit downloads/"; exit 1; }

      # v36.14 — Tony's Meal menu rendered #F2EDE6 text on a hard-coded white
      # panel (1.16:1) and nothing in the suite could see it, because the panel
      # is MOBILE ONLY and every check ran at desktop width. This opens every
      # menu, panel and modal at phone width and measures what rendered.
      - name: Contrast scan (phone width, both themes)
        run: |
          THEME=dark  node tests/contrast-scan.js --port 8137
          THEME=light node tests/contrast-scan.js --port 8137

      # v36.23 — same reason as the contrast scan: the header collapse only
      # happens below 700px, and the self-test suite runs at the headless
      # default width, so every assertion about the phone would pass vacuously.
      # This drives a real 390x844 viewport and holds the fixed chrome to a
      # budget, so a new header row fails the build and says by how much.
      - name: Phone chrome budget (390x844)
        run: node tests/phone-chrome.js --port 8137

      # v38.48 — Tony, as a new tester: a double-click on "Let's cook!" opened the
      # Free-hand window, its second click landing on "Paste the text" under the box.
      # The guard only holds back REAL clicks, which no self-test can make — so a
      # real mouse proves it here, at Tony's screen size.
      - name: Double-clicks stay where they began (real mouse)
        run: node tests/double-click.js --port 8137

      # v38.49 — Tony: in many windows the ✕ "disappears when scrolling down". Every
      # window is opened, made to scroll, scrolled to the end, and its ✕ must still
      # be there to tap — at a computer's size and a phone's.
      - name: Every window's close button stays in view
        run: node tests/close-in-view.js --port 8137

      # v36.65 (audit block 6) — axe-core over the page, the recipe view and
      # every dialog opened in turn. A dialog's controls only exist to a
      # scanner while it is open; both findings the audit made were in places
      # a scan of the start page never sees. Serious or critical fails.
      - name: Accessibility scan (axe, every dialog)
        run: node tests/axe-scan.js --port 8137
