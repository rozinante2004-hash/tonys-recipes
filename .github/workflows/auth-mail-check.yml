name: Sign-in e-mails

# The audit (20 Oct 2026): what the e-mails Firebase sends a tester say — the
# sender's name and the subject carry the project's public-facing name, which
# left at Google's default is "project-<number>". Read only; names, subjects and
# yes/no in the log, never an e-mail address (tools/auth-mail-check.mjs).

on:
  workflow_dispatch:
  push:
    branches: ["test"]
    paths: ["tools/auth-mail-check.mjs", ".github/workflows/auth-mail-check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      FIREBASE_KEY: ${{ secrets.FIREBASE_RULES_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Read the Authentication settings
        run: |
          if [ -z "$FIREBASE_KEY" ]; then echo "::error::FIREBASE_RULES_KEY is missing"; exit 1; fi
          npm install --no-save --no-audit --no-fund google-auth-library@9 >/dev/null 2>&1
          node tools/auth-mail-check.mjs my-kitchen-notes-beta tonys-recipes-test
