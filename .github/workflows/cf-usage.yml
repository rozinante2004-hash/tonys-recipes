name: Cloudflare usage

# What used the account's Cloudflare free allowances (Worker requests, KV
# writes, D1 rows), hour by hour in Israel time. Counts only — the log is
# public. Run by hand, or by a push that changes the tool or this file — and
# every hour (v79), when it only tells the Worker today's use (--report).

on:
  # v79 — the usage watch: every hour, today's use is told to the Worker, which warns the owner at 70%.
  schedule:
    - cron: "41 * * * *"
    - cron: "11 * * * *"     # twice an hour: GitHub drops scheduled runs when it is busy (one of five ran, 20 Oct)
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back (1–7)"
        default: "2"
  push:
    branches: ["test"]
    paths: ["tools/cf-usage.js", ".github/workflows/cf-usage.yml"]

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_RULES_KEY: ${{ secrets.FIREBASE_RULES_KEY }}
        run: |
          # v79 — Firestore's day too, through Cloud Monitoring (the service account needs "Monitoring Viewer")
          if [ -n "$FIREBASE_RULES_KEY" ]; then npm install --no-save --no-audit --no-fund google-auth-library@9 >/dev/null 2>&1 || true; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then node tools/cf-usage.js --report
          else node tools/cf-usage.js "${{ github.event.inputs.days || '2' }}" && node tools/cf-usage.js --report; fi
